<body>
    <!-- Navbar -->
    <nav class="ui-nav">
        <a href="{{ url_for('home') }}">
            <img src="static/images/logo.jpg" alt="Crime Data Dashboard Logo" class="logo">
        </a>
        <h2>
            <a href="{{ url_for('home') }}">Urban Insights</a>
        </h2>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('about') }}">About Us</a></li>
      <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
      <li><a href="{{ url_for('login_m') }}">Login</a></li>
        </ul>
    </nav>
    <!-- login section start -->
    <div class="limiter">
        <div class="container-login100" style="background-image: url('static/images/bg_1.jpg');">
            <div class="wrap-login100 p-t-30 p-b-50">
                <br /><br /><span class="login100-form-title p-b-41">
                    Member Login
                </span>
                <div class="outer-container">
                    <div class="container mt-5 form-container">
                        <form id="login-form" method="POST" onsubmit="login(event)">
                            <!-- class="login100-form validate-form p-b-33 p-t-5" -->
                            <div class="form-group login-sec">
                                <label for="username">Email address</label>
                                <input type="email" class="form-control" id="username" aria-describedby="emailHelp"
                                    placeholder="Enter email" required>
                            </div>
                            <div class="form-group login-sec">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Password"
                                    required>
                            </div>
                            <div class="container-login100-form-btn m-t-32">
                                <button class="login100-form-btn" type="submit">
                                    Login
                                </button>
                            </div>
                            <div class="flex justify-between forgotPass">
                                <p><a href="forgotpassword.html">Forgot password?</a></p>
                                <p><a href="{{ url_for('signup') }}">Sign Up</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

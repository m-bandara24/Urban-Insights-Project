<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Insights - Sign Up</title>
    <link rel="icon" type="image/png" href="images/icons/ui_icon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700,700i,900,900i&display=swap"
      rel="stylesheet">
  
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
  
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
  
    <link rel="stylesheet" href="css/aos.css">
  
    <link rel="stylesheet" href="css/ionicons.min.css">
  
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style-new.css">
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <!-- Navbar -->
    <nav class="ui-nav">
        <a href="./index.html">
            <img src="./images/logo.jpg" alt="Crime Data Dashboard Logo" class="logo">
        </a>
        <h2>
            <a href="./index.html">Urban Insights</a>
        </h2>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./about.html">About Us</a></li>
            <li><a href="./contact.html">Contact Us</a></li>
            <li><a href="./login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Sign Up Section -->
    <section class="login">
        <h2>Sign Up</h2>
        <form onsubmit="signUp(event)">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" required>

            <button type="submit">Sign Up</button>
        </form>
        <p class="mt-1">Already have an account? <a href="./login.html">Login here</a>.</p>
    </section>
</body>
<script src="js/index.js"></script>


</html>

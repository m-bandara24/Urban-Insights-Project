<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Insights - Reset Password</title>
    <link rel="icon" type="image/png" href="images/icons/ui_icon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700,700i,900,900i&display=swap"
      rel="stylesheet">
  
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
  
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
  
    <link rel="stylesheet" href="css/aos.css">
  
    <link rel="stylesheet" href="css/ionicons.min.css">
  
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style-new.css">
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Reset Password Section -->
    <section class="login">
        <h2>Reset Your Password</h2>
        <p>Enter your email address below, and we'll send you instructions on how to reset your password.</p>
        <form id="resetPasswordForm">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
            <label for="token">Token</label>
            <input type="text" id="token" name="token" placeholder="Enter the reset code" required />
            <label for="password">Password</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required />
            <button type="submit">Reset Password</button>
        </form>
        <p id="responseMessage"></p>
    </section>


    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;

            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, token, new_password: newPassword }),
            });

            const result = await response.json();
            document.getElementById('responseMessage').innerText = result.message;
        });
    </script>
</body>

</html>
